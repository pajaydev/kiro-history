name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url here on purpose: it makes setup-node write an .npmrc
      # referencing ${NODE_AUTH_TOKEN}, and npm hard-fails when that env var
      # is unset. The repo's own .npmrc already pins the registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Compare package.json against what is actually live on npm, so a
      # re-run after a failed publish still ships and a no-op push skips.
      - name: Check if version is published
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LIVE=$(npm view "kiro-history@$CURRENT" version 2>/dev/null || true)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LIVE" = "$CURRENT" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v$CURRENT is already on npm - skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "v$CURRENT is not on npm - publishing"
          fi

      # npm first: a credential failure must not leave a GitHub Release
      # pointing at a version that was never published.
      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: |
          npm ci
          npm publish

      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
